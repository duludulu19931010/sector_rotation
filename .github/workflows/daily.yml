name: Daily Market Update

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 台灣時間 18:30（UTC+8），週一到五
  workflow_dispatch:
    inputs:
      force:
        description: "強制重新抓取（忽略快取）"
        type: boolean
        default: false

# 整個 workflow 層級的 permissions
# deploy-pages 需要 id-token: write，必須在這裡宣告
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Fetch & Compute
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell   # Windows 內建 PowerShell 5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Verify Python
        run: |
          $v = python --version 2>&1
          Write-Host "Python: $v"
          if ($v -notmatch "3\.") {
            Write-Error "Python 3 not found. Please add Python to PATH."
            exit 1
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -q

      - name: Run pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if ("${{ github.event.inputs.force }}" -eq "true") {
            python pipeline.py --force
          } else {
            python pipeline.py
          }

      - name: Verify outputs
        run: |
          $files = @(
            "docs\assets\data\bubble_data.json",
            "docs\assets\data\inflow_low_gain.json",
            "docs\assets\data\stealth_accumulation.json",
            "docs\assets\data\metadata.json",
            "db\market.db"
          )
          $ok = $true
          foreach ($f in $files) {
            if (Test-Path $f) {
              Write-Host "OK  $f  ($((Get-Item $f).Length) bytes)"
            } else {
              Write-Host "MISSING  $f"
              $ok = $false
            }
          }
          if (-not $ok) { exit 1 }

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/ db/market.db
          $s = git status --porcelain
          if ($s) {
            git commit -m "data: $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
          } else {
            Write-Host "Nothing to commit"
          }

  deploy:
    name: Deploy GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout (after data push)
        uses: actions/checkout@v4
        with:
          ref: main   # 取最新 commit（含剛 push 的資料）

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
