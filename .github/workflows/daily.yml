name: Daily Market Update

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "強制重新抓取"
        type: boolean
        default: false
      reset_history:
        description: "重新補抓歷史（清除 TPEx=0 的日期）"
        type: boolean
        default: false
      dry_run:
        description: "Dry run（不打API，只用現有DB+CSV重算）"
        type: boolean
        default: false
      check_code:
        description: "查詢股票代號（留空則不查）"
        type: string
        default: ""
      run_tpex_test:
        description: "測試 TPEx daily_close_quotes 是否支援歷史日期參數"
        type: boolean
        default: false
      run_tpex_fields_test:
        description: "比對 tpex_mainboard_quotes 與 daily_close_quotes 欄位"
        type: boolean
        default: false
      run_tpex_new_history_test:
        description: "探測 TPEx 新版個股日成交資訊頁面背後的API端點"
        type: boolean
        default: false
      check_db_status:
        description: "診斷 DB 現狀（各日期 trade_value/inst_net/net_yi 分布）"
        type: boolean
        default: false
      purge_bad_data:
        description: "清除 trade_value=0 的污染歷史資料並重新補抓"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Fetch & Compute
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Verify Python
        run: |
          $v = python --version 2>&1
          Write-Host "Python: $v"
          if ($v -notmatch "3\.") { Write-Error "Python 3 not found"; exit 1 }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -q

      - name: Test TPEx daily_close_quotes date param
        if: ${{ github.event.inputs.run_tpex_test == 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python test_tpex_daily_close.py

      - name: Test TPEx field names
        if: ${{ github.event.inputs.run_tpex_fields_test == 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python test_tpex_fields.py

      - name: Probe TPEx new stock-pricing history endpoint
        if: ${{ github.event.inputs.run_tpex_new_history_test == 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python test_tpex_new_history.py

      - name: Run pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $flags = @()
          if ("${{ github.event.inputs.force }}" -eq "true")          { $flags += "--force" }
          if ("${{ github.event.inputs.reset_history }}" -eq "true")  { $flags += "--reset-history" }
          if ("${{ github.event.inputs.dry_run }}" -eq "true")        { $flags += "--dry-run" }
          if ("${{ github.event.inputs.purge_bad_data }}" -eq "true") { $flags += "--purge-bad-data" }
          if ($flags.Count -gt 0) {
            python pipeline.py @flags
          } else {
            python pipeline.py
          }

      - name: Check record
        if: ${{ github.event.inputs.check_code != '' }}
        run: |
          python check_record.py "${{ github.event.inputs.check_code }}"
          Write-Host "---"
          python check_record.py --date $(Get-Date -Format 'yyyy-MM-dd')

      - name: Check DB status
        if: ${{ github.event.inputs.check_db_status == 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python check_db_status.py

      - name: Verify outputs
        run: |
          $files = @(
            "docs\assets\data\bubble_data.json",
            "docs\assets\data\inflow_low_gain.json",
            "docs\assets\data\stealth_accumulation.json",
            "docs\assets\data\metadata.json",
            "db\market.db"
          )
          $ok = $true
          foreach ($f in $files) {
            if (Test-Path $f) { Write-Host "OK  $f  ($((Get-Item $f).Length) bytes)" }
            else { Write-Host "MISSING  $f"; $ok = $false }
          }
          if (-not $ok) { exit 1 }

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/ db/market.db
          $s = git status --porcelain
          if ($s) {
            git commit -m "data: $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
          } else {
            Write-Host "Nothing to commit"
          }

  deploy:
    name: Deploy GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - id: deploy
        uses: actions/deploy-pages@v4
