name: Daily Market Update

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "強制重抓今日"
        type: boolean
        default: false
      reset_history:
        description: "重新補抓 TWSE 歷史（近30天）"
        type: boolean
        default: false
      dry_run:
        description: "Dry run（不打API，只用現有DB重算）"
        type: boolean
        default: false
      purge_bad_data:
        description: "清除污染資料（trade_value=0）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Fetch & Compute
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Verify Python
        run: |
          $v = python --version 2>&1
          Write-Host "Python: $v"
          if ($v -notmatch "3\.") { Write-Error "Python 3 not found"; exit 1 }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -q

      - name: Run pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $flags = @()
          if ("${{ github.event.inputs.force }}"          -eq "true") { $flags += "--force" }
          if ("${{ github.event.inputs.reset_history }}"  -eq "true") { $flags += "--reset-history" }
          if ("${{ github.event.inputs.dry_run }}"        -eq "true") { $flags += "--dry-run" }
          if ("${{ github.event.inputs.purge_bad_data }}" -eq "true") { $flags += "--purge-bad-data" }
          if ($flags.Count -gt 0) { python pipeline.py @flags } else { python pipeline.py }

      - name: Verify outputs
        run: |
          $files = @(
            "docs\assets\data\bubble_data.json",
            "docs\assets\data\metadata.json"
          )
          foreach ($f in $files) {
            if (Test-Path $f) { Write-Host "OK  $f  ($((Get-Item $f).Length) bytes)" }
            else { Write-Error "MISSING: $f"; exit 1 }
          }
          # DB 不進 git（留在本機供下次執行），僅確認存在
          if (Test-Path "db\market.db") {
            $mb = [math]::Round((Get-Item "db\market.db").Length / 1MB, 1)
            Write-Host "DB local: $mb MB (not committed)"
          }

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 清掉上次中斷殘留的 rebase 狀態
          if (Test-Path ".git\rebase-merge") { git rebase --abort 2>$null; Remove-Item -Recurse -Force ".git\rebase-merge" -ErrorAction SilentlyContinue }
          if (Test-Path ".git\rebase-apply") { git rebase --abort 2>$null; Remove-Item -Recurse -Force ".git\rebase-apply" -ErrorAction SilentlyContinue }
          # 先同步遠端，再 commit，避免 rebase 衝突
          git pull --rebase --autostash origin main
          git add docs/assets/data/
          $s = git status --porcelain
          if ($s) {
            $msg = "data: $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git commit -m $msg -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01YDZqRgyF67fE9Y2M5fK1bm"
            git push
          } else {
            Write-Host "Nothing to commit"
          }

  deploy:
    name: Deploy GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify JSON
        run: |
          test -s docs/assets/data/bubble_data.json && echo "OK" || (echo "bubble_data.json missing"; exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - id: deploy
        uses: actions/deploy-pages@v4
