name: Daily Market Update

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "強制重新抓取"
        type: boolean
        default: false
      reset_history:
        description: "重新補抓歷史（清除 TPEx=0 的日期）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Fetch & Compute
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Verify Python
        run: |
          $v = python --version 2>&1
          Write-Host "Python: $v"
          if ($v -notmatch "3\.") { Write-Error "Python 3 not found"; exit 1 }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -q

      - name: Run pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $flags = @()
          if ("${{ github.event.inputs.force }}" -eq "true")         { $flags += "--force" }
          if ("${{ github.event.inputs.reset_history }}" -eq "true") { $flags += "--reset-history" }
          if ($flags.Count -gt 0) {
            python pipeline.py @flags
          } else {
            python pipeline.py
          }

      - name: Verify outputs
        run: |
          $files = @(
            "docs\assets\data\bubble_data.json",
            "docs\assets\data\inflow_low_gain.json",
            "docs\assets\data\stealth_accumulation.json",
            "docs\assets\data\metadata.json",
            "db\market.db"
          )
          $ok = $true
          foreach ($f in $files) {
            if (Test-Path $f) { Write-Host "OK  $f  ($((Get-Item $f).Length) bytes)" }
            else { Write-Host "MISSING  $f"; $ok = $false }
          }
          if (-not $ok) { exit 1 }

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/ db/market.db
          $s = git status --porcelain
          if ($s) {
            git commit -m "data: $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
          } else {
            Write-Host "Nothing to commit"
          }

  deploy:
    name: Deploy GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - id: deploy
        uses: actions/deploy-pages@v4
