<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW$FLOW Debug 2</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
body{font-family:monospace;background:#0a0e14;color:#8aa8bf;padding:20px;font-size:15px;line-height:1.7}
h1{color:#e8b840}
.box{margin:10px 0;padding:14px;background:#131a22;border-radius:6px;border-left:3px solid #4a6278}
.box.ok{border-left-color:#00c070}
.box.fail{border-left-color:#f03e2a}
.label{color:#cce0f0;font-weight:bold;font-size:16px}
pre{background:#07090d;padding:12px;border-radius:4px;overflow:auto;font-size:13px;color:#f03e2a;max-height:400px;white-space:pre-wrap;word-break:break-all}
.sample{color:#4a6278;font-size:12px}
#chart{height:300px;background:#0d1118;border-radius:6px;margin-top:10px}
</style>
</head>
<body>
<h1>TW$FLOW 渲染診斷</h1>
<div id="log"></div>
<div id="chart"></div>

<script>
const BASE='./assets/data/';
const logDiv=document.getElementById('log');

function box(label, ok, content){
  const d=document.createElement('div');
  d.className='box '+(ok?'ok':'fail');
  d.innerHTML=`<span class="label">${ok?'✓':'✗'} ${label}</span>`+(content?`<div>${content}</div>`:'');
  logDiv.appendChild(d);
  return d;
}

const load=async p=>{
  const r=await fetch(p+'?v='+Date.now());
  if(!r.ok)throw new Error('HTTP '+r.status);
  return JSON.parse(await r.text());
};

let chart=null;
const BCOL={'主力':'#f03e2a','輪動':'#dd8040','退潮':'#00c070','觀望':'#4a6278'};
let activeLabels=new Set(['主力','輪動','退潮','觀望']);

const fN=(v,d=2)=>{const n=parseFloat(v);return isNaN(n)?'—':(n>0?'+':'')+n.toFixed(d)};
const fYi=v=>fN(v,2)+'億';
const fPct=v=>fN(v,2)+'%';
const col=v=>parseFloat(v)>=0?'#f03e2a':'#00c070';
const cls=v=>parseFloat(v)>0?'r':parseFloat(v)<0?'g':'n';

function isRegularStock(code){
  return typeof code==='string' && code.length===4 && /^[1-9]/.test(code);
}

function renderPills(data){
  const seen=new Set();
  let si=0,so=0;
  data.forEach(r=>(r.stocks||[]).forEach(s=>{
    if(!seen.has(s.code) && isRegularStock(s.code)){
      seen.add(s.code);
      if(s.net_5d>0)si+=s.net_5d;
      else so+=s.net_5d;
    }
  }));
  return {si,so,count:seen.size};
}

function renderBubble(data){
  const el=document.getElementById('chart');
  if(!chart){chart=echarts.init(el);}
  const grp={'主力':[],'輪動':[],'退潮':[],'觀望':[]};
  data.forEach(d=>(grp[d.label]||grp['觀望']).push({value:[d.x,d.y,Math.abs(d.net_5d)],name:d.g,_:d}));
  const allX=data.map(d=>d.x),allY=data.map(d=>d.y);
  const xp=(Math.max(...allX.map(Math.abs))||1)*.12;
  const yp=(Math.max(...allY.map(Math.abs))||1)*.2;
  chart.setOption({
    backgroundColor:'transparent',
    xAxis:{min:Math.min(...allX)-xp,max:Math.max(...allX)+xp},
    yAxis:{min:Math.min(...allY)-yp,max:Math.max(...allY)+yp},
    series:Object.entries(grp).map(([nm,pts])=>({
      name:nm,type:'scatter',data:activeLabels.has(nm)?pts:[],
      symbolSize:d=>Math.max(13,Math.min(76,d[2]*2.8+13)),
      itemStyle:{color:BCOL[nm],opacity:.82}
    }))
  });
}

async function run(){
  let ALL, INFLOW, STEALTH, SCREENER;

  // 1. 載入
  try{
    [ALL,INFLOW,STEALTH,SCREENER]=await Promise.all([
      load(BASE+'bubble_data.json'),
      load(BASE+'inflow_low_gain.json'),
      load(BASE+'stealth_accumulation.json'),
      load(BASE+'stock_screener.json'),
    ]);
    box('載入 4 個 JSON', true, `bubble=${ALL.length}, inflow=${INFLOW.length}, stealth=${STEALTH.length}, screener=${SCREENER.length}`);
  }catch(e){
    box('載入失敗', false, `<pre>${e.stack||e.message}</pre>`);
    return;
  }

  // 2. 檢查 bubble_data 第一筆結構
  if(ALL.length){
    const s=ALL[0];
    box('bubble_data[0] 欄位', true,
      `<div class="sample">keys: ${Object.keys(s).join(', ')}</div>`+
      `<div class="sample">g=${s.g}, x=${s.x}, y=${s.y}, net_5d=${s.net_5d}, net_1d=${s.net_1d}, label=${s.label}</div>`+
      `<div class="sample">stocks 數量: ${(s.stocks||[]).length}</div>`);

    // 檢查是否有 x/y 為 undefined 或非數字
    const badXY=ALL.filter(d=>typeof d.x!=='number'||typeof d.y!=='number'||isNaN(d.x)||isNaN(d.y));
    if(badXY.length){
      box('發現 x/y 異常的族群', false,
        `<div class="sample">${badXY.length} 筆異常</div>`+
        `<pre>${JSON.stringify(badXY.slice(0,3).map(d=>({g:d.g,x:d.x,y:d.y})),null,2)}</pre>`);
    }else{
      box('x/y 數值檢查', true, '全部為合法數字');
    }
  }

  // 3. 執行 renderPills
  try{
    const r=renderPills(ALL);
    box('renderPills 執行', true, `合計流入=${r.si.toFixed(1)}億, 合計流出=${r.so.toFixed(1)}億, 去重個股=${r.count}`);
  }catch(e){
    box('renderPills 失敗', false, `<pre>${e.stack||e.message}</pre>`);
  }

  // 4. 執行 renderBubble
  try{
    renderBubble(ALL);
    box('renderBubble 執行', true, '泡泡圖渲染成功（見下方）');
  }catch(e){
    box('renderBubble 失敗', false, `<pre>${e.stack||e.message}</pre>`);
  }

  box('診斷完成', true, '如果上面全部綠色，但主頁仍卡住，請確認主頁的 sector.html 是最新版本');
}
run().catch(e=>box('未捕捉的錯誤', false, `<pre>${e.stack||e.message}</pre>`));
</script>
</body>
</html>
