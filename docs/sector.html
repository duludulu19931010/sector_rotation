<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW$FLOW · 族群資金儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
  --ink:#07090d;--surf:#0d1118;--raised:#131a22;--line:#1a2535;
  --muted:#243040;--dim:#4a6278;--body:#8aa8bf;--hi:#cce0f0;
  --red:#f04030;--green:#00c070;--gold:#e8b840;
  --mono:'JetBrains Mono',monospace;
  --sans:'Noto Sans TC',sans-serif;
  --fs:22px;            /* base font 放大 2 倍 */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--body);
  font-family:var(--sans);font-size:var(--fs);line-height:1.6;
  min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(74,98,120,.14) 1px,transparent 1px);
  background-size:28px 28px;
}

/* ── TOP BAR ── */
.bar{
  position:sticky;top:0;z-index:200;height:64px;
  background:rgba(7,9,13,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 24px;gap:20px;
}
.brand{font-family:var(--mono);font-size:26px;font-weight:600;
  letter-spacing:3px;color:var(--hi)}
.brand em{color:var(--gold);font-style:normal}
.stamp{font-family:var(--mono);font-size:16px;color:var(--dim);
  display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;background:var(--green);border-radius:50%;
  animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tabs{display:flex;margin-left:auto;gap:3px}
.tab{padding:8px 20px;font-family:var(--mono);font-size:16px;
  letter-spacing:1px;color:var(--dim);cursor:pointer;border-radius:4px;
  transition:all .16s;white-space:nowrap}
.tab:hover{color:var(--body);background:var(--raised)}
.tab.on{color:var(--gold);background:rgba(232,184,64,.08)}

/* ── WRAP ── */
.wrap{position:relative;z-index:1;max-width:1700px;margin:0 auto;padding:24px}
.pane{display:none}.pane.on{display:block}

/* ── SECTION LABEL ── */
.slabel{
  display:flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:16px;letter-spacing:2px;
  color:var(--dim);text-transform:uppercase;
  margin-bottom:18px;padding-bottom:10px;
  border-bottom:1px solid var(--line);
}
.slabel .bar2{width:4px;height:19px;background:var(--gold);border-radius:2px}

/* ── PILLS ── */
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pill{display:flex;flex-direction:column;padding:12px 18px;min-width:140px;
  background:var(--raised);border:1px solid var(--line);border-radius:5px}
.plabel{font-family:var(--mono);font-size:13px;letter-spacing:1px;
  color:var(--dim);margin-bottom:4px}
.pval{font-family:var(--mono);font-size:27px;font-weight:600;color:var(--hi)}
.pval.r{color:var(--red)}.pval.g{color:var(--green)}.pval.gold{color:var(--gold)}

/* ── CARD ── */
.card{background:var(--surf);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.chead{padding:13px 17px;border-bottom:1px solid var(--line);
  background:var(--raised);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctitle{font-family:var(--mono);font-size:15px;letter-spacing:1px;color:var(--dim)}
.cbody{padding:16px}

/* ── CTRL BTNS ── */
.ctrls{display:flex;gap:7px;margin-left:auto}
.cbtn{padding:6px 14px;font-family:var(--mono);font-size:14px;
  color:var(--dim);background:var(--raised);border:1px solid var(--line);
  border-radius:4px;cursor:pointer;transition:all .14s}
.cbtn:hover{color:var(--body);border-color:var(--muted)}
.cbtn.on{color:var(--gold);border-color:rgba(232,184,64,.45);
  background:rgba(232,184,64,.07)}

/* ── LEGEND ── */
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:15px;color:var(--dim)}
.ld{width:13px;height:13px;border-radius:50%}

/* ── BUBBLE CHART ── */
#bubbleChart{width:100%;height:620px}
.zoom-hint{font-family:var(--mono);font-size:13px;color:var(--muted);
  text-align:right;padding:2px 8px}

/* ── SIDE PANEL（點泡泡彈出）── */
.spanel{
  position:fixed;top:64px;right:-560px;bottom:0;width:540px;
  background:var(--surf);border-left:1px solid var(--line);
  z-index:300;overflow-y:auto;
  transition:right .28s cubic-bezier(.4,0,.2,1);
  box-shadow:-12px 0 40px rgba(0,0,0,.5);
}
.spanel.open{right:0}
.sp-head{
  position:sticky;top:0;background:var(--raised);
  border-bottom:1px solid var(--line);
  padding:16px 20px;display:flex;align-items:center;gap:12px;
}
.sp-title{font-size:24px;font-weight:600;color:var(--hi)}
.sp-close{
  margin-left:auto;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--muted);border-radius:4px;
  color:var(--dim);cursor:pointer;font-size:18px;
  transition:all .14s;
}
.sp-close:hover{color:var(--red);border-color:var(--red)}
.sp-body{padding:18px 20px}

/* 表一：族群指標 */
.sp-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:22px;
}
.sp-stat{
  background:var(--raised);border:1px solid var(--line);
  border-radius:5px;padding:12px 14px;
}
.sp-stat-label{font-family:var(--mono);font-size:13px;
  letter-spacing:1px;color:var(--dim);margin-bottom:4px}
.sp-stat-val{font-family:var(--mono);font-size:24px;font-weight:600}

/* 表二：個股清單 */
.sp-sec{font-family:var(--mono);font-size:14px;letter-spacing:2px;
  color:var(--dim);margin:18px 0 9px;padding-bottom:6px;
  border-bottom:1px solid var(--line)}
.sp-table{width:100%;border-collapse:collapse}
.sp-table th{
  font-family:var(--mono);font-size:13px;letter-spacing:1px;
  color:var(--dim);text-align:left;padding:7px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
.sp-table td{padding:8px 9px;border-bottom:1px solid rgba(26,37,53,.55);
  font-size:16px}
.sp-table tr:hover td{background:var(--raised)}
.sp-code{font-family:var(--mono);font-size:15px;color:var(--gold)}
.sp-num{font-family:var(--mono);font-size:15px;text-align:right;white-space:nowrap}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:250;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:auto}

/* ── FILTER TABLE ── */
.ftable{width:100%;border-collapse:collapse}
.ftable thead th{
  font-family:var(--mono);font-size:14px;letter-spacing:1px;
  color:var(--dim);text-align:left;padding:10px 13px;
  border-bottom:1px solid var(--line);background:var(--raised);
  white-space:nowrap}
.ftable tbody tr.grow{border-bottom:1px solid var(--line);cursor:pointer}
.ftable tbody tr.grow:hover td{background:var(--raised)}
.ftable tbody td{padding:11px 13px;vertical-align:middle}
.td-num{font-family:var(--mono);font-size:18px;text-align:right;white-space:nowrap}
.td-name{font-size:19px;color:var(--hi)}
.td-rank{font-family:var(--mono);font-size:15px;color:var(--dim);width:46px;text-align:center}
.r{color:var(--red)}.g{color:var(--green)}.n{color:var(--dim)}

.bcell{position:relative}
.bbar{position:absolute;left:0;top:0;bottom:0;border-radius:2px;opacity:.2}
.bval{position:relative;z-index:1}

.badge{display:inline-block;padding:3px 9px;border-radius:4px;
  font-family:var(--mono);font-size:13px}
.b主{background:rgba(240,64,48,.15);color:var(--red)}
.b輪{background:rgba(220,110,50,.1);color:#dd8040}
.b退{background:rgba(0,192,112,.1);color:var(--green)}
.b觀{background:rgba(74,98,120,.15);color:var(--dim)}

tr.srow{display:none}
tr.srow.on{display:table-row}
tr.srow td{padding:0;background:rgba(7,9,13,.55);border-bottom:2px solid var(--muted)}
.sinner{padding:13px 17px 18px}
.shdr{display:grid;
  grid-template-columns:66px minmax(90px,1fr) 110px 140px 110px 140px;
  gap:0 10px;font-family:var(--mono);font-size:13px;letter-spacing:1px;
  color:var(--dim);padding:7px 0;border-bottom:1px solid var(--line);margin-bottom:2px}
.srow-item{display:grid;
  grid-template-columns:66px minmax(90px,1fr) 110px 140px 110px 140px;
  gap:0 10px;padding:9px 0;
  border-bottom:1px solid rgba(26,37,53,.6);font-size:17px;transition:background .1s}
.srow-item:hover{background:rgba(19,26,34,.6);border-radius:3px}
.srow-item:last-child{border-bottom:none}
.s-code{font-family:var(--mono);font-size:15px;color:var(--gold)}
.s-name{color:var(--hi)}
.s-num{font-family:var(--mono);font-size:16px;text-align:right}

.eico{display:inline-block;width:21px;height:21px;line-height:21px;
  text-align:center;border:1px solid var(--muted);border-radius:3px;
  font-family:var(--mono);font-size:13px;color:var(--dim);
  margin-right:9px;transition:transform .18s;flex-shrink:0}
.grow.exp .eico{transform:rotate(90deg);color:var(--gold);border-color:var(--gold)}

.empty{padding:80px 36px;text-align:center;
  font-family:var(--mono);font-size:18px;color:var(--dim)}
.empty strong{display:block;color:var(--gold);font-size:21px;margin-bottom:10px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}

@media(max-width:760px){
  :root{--fs:17px}
  .wrap{padding:13px}
  .bar{padding:0 13px;height:56px}
  .brand{font-size:20px}
  .tab{padding:5px 11px;font-size:13px}
  #bubbleChart{height:400px}
  .spanel{width:100vw;right:-100vw}
  .shdr,.srow-item{grid-template-columns:54px 1fr 100px 120px}
  .shdr>*:nth-child(n+5),.srow-item>*:nth-child(n+5){display:none}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">TW<em>$</em>FLOW</div>
  <div class="stamp"><span class="dot"></span><span id="stamp">載入中…</span></div>
  <nav class="tabs">
    <div class="tab on" data-p="bubble">板塊泡泡圖</div>
    <div class="tab" data-p="inflow">流入低漲幅</div>
    <div class="tab" data-p="stealth">偷偷布局</div>
  </nav>
</header>

<!-- ── SIDE PANEL ── -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<aside class="spanel" id="spanel">
  <div class="sp-head">
    <div class="sp-title" id="sp-title">—</div>
    <div class="sp-close" onclick="closePanel()">✕</div>
  </div>
  <div class="sp-body">
    <div class="sp-sec">族群指標</div>
    <div class="sp-stats" id="sp-stats"></div>
    <div class="sp-sec">個股明細・依當日買賣超排序</div>
    <table class="sp-table">
      <thead><tr>
        <th>代碼</th><th>名稱</th>
        <th style="text-align:right">當日漲跌幅</th>
        <th style="text-align:right">當日買賣超(億)</th>
      </tr></thead>
      <tbody id="sp-stocks"></tbody>
    </table>
  </div>
</aside>

<div class="wrap">

  <!-- ① Bubble -->
  <div class="pane on" id="p-bubble">
    <div class="slabel"><span class="bar2"></span>族群板塊輪動・資金動向分佈圖</div>
    <div class="pills" id="pills"></div>
    <div class="card">
      <div class="chead">
        <div class="ctitle">
          X 軸＝五日淨買超（億）｜Y 軸＝今日淨買超（億）｜圓圈大小＝五日量
        </div>
        <div class="ctrls">
          <div class="cbtn on" onclick="filterBubble('all',this)">全部</div>
          <div class="cbtn" onclick="filterBubble('in',this)">流入</div>
          <div class="cbtn" onclick="filterBubble('out',this)">流出</div>
          <div class="cbtn" onclick="resetZoom(this)">重置縮放</div>
        </div>
      </div>
      <div class="cbody" style="padding:13px 13px 8px">
        <div class="legend">
          <div class="li"><div class="ld" style="background:#f04030"></div>主力</div>
          <div class="li"><div class="ld" style="background:#dd8040"></div>輪動</div>
          <div class="li"><div class="ld" style="background:#00c070"></div>退潮</div>
          <div class="li"><div class="ld" style="background:#4a6278"></div>觀望</div>
        </div>
        <div id="bubbleChart"></div>
        <div class="zoom-hint">滾輪縮放 · 拖曳平移 · 點擊泡泡看詳情</div>
      </div>
    </div>
  </div>

  <!-- ② Inflow -->
  <div class="pane" id="p-inflow">
    <div class="slabel"><span class="bar2"></span>資金大量流入・但漲幅仍低</div>
    <div class="card">
      <div class="chead">
        <div class="ctitle">五日淨買超&gt;0 且 五日漲幅&lt;10%｜排序：五日淨買超↓｜點擊展開個股</div>
      </div>
      <div id="inflowContent"></div>
    </div>
  </div>

  <!-- ③ Stealth -->
  <div class="pane" id="p-stealth">
    <div class="slabel"><span class="bar2"></span>大盤跌但法人偷偷布局</div>
    <div class="card">
      <div class="chead">
        <div class="ctitle">今日淨買超&gt;0 且 五日淨買超&gt;0 且 五日漲幅&lt;0%｜排序：五日淨買超↓</div>
      </div>
      <div id="stealthContent"></div>
    </div>
  </div>

</div>

<script>
const BASE = './assets/data/';
let ALL = [], INFLOW = [], STEALTH = [];
let chart = null;

// ── TABS ──
document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('p-' + t.dataset.p)?.classList.add('on');
    if (t.dataset.p === 'bubble' && chart) setTimeout(() => chart.resize(), 60);
  })
);

const load = async p => {
  try { const r = await fetch(p); if (!r.ok) throw r.status; return await r.json(); }
  catch(e) { console.warn('load fail:', p, e); return null; }
};
const fN = (v,d=2) => { const n=parseFloat(v); return isNaN(n)?'—':(n>0?'+':'')+n.toFixed(d); };
const fYi  = v => fN(v,2)+'億';
const fPct = v => fN(v,2)+'%';
const cls  = v => parseFloat(v)>0?'r':parseFloat(v)<0?'g':'n';
const col  = v => parseFloat(v)>=0?'#f04030':'#00c070';

async function loadMeta(){
  const m = await load(BASE+'metadata.json');
  document.getElementById('stamp').textContent = m?.last_updated ?? '尚未更新';
}

// ── PILLS ──
function renderPills(data){
  const inR=data.filter(r=>r.net_5d>0), outR=data.filter(r=>r.net_5d<0);
  const si=inR.reduce((s,r)=>s+r.net_5d,0), so=outR.reduce((s,r)=>s+r.net_5d,0);
  const top=data.reduce((a,b)=>b.net_5d>a.net_5d?b:a,{net_5d:-1e9,group_name:'—'});
  const bot=data.reduce((a,b)=>b.net_5d<a.net_5d?b:a,{net_5d:1e9,group_name:'—'});
  document.getElementById('pills').innerHTML=[
    ['族群數',data.length,'gold'],
    ['合計流入',si.toFixed(1)+'億','r'],
    ['合計流出',Math.abs(so).toFixed(1)+'億','g'],
    ['最強主力',top.group_name.slice(0,6),'r'],
    ['最大退潮',bot.group_name.slice(0,6),'g'],
  ].map(([l,v,c])=>`<div class="pill"><span class="plabel">${l}</span><span class="pval ${c}">${v}</span></div>`).join('');
}

// ── BUBBLE ──
const BCOL={'主力':'#f04030','輪動':'#dd8040','退潮':'#00c070','觀望':'#4a6278'};

function renderBubble(data){
  const el=document.getElementById('bubbleChart');
  if(!chart){
    chart=echarts.init(el,null,{renderer:'canvas'});
    window.addEventListener('resize',()=>chart.resize());
    // 點擊泡泡 → 側欄
    chart.on('click', params => {
      if (params.data && params.data._) openPanel(params.data._);
    });
  }
  const grp={'主力':[],'輪動':[],'退潮':[],'觀望':[]};
  data.forEach(d=>(grp[d.label]||grp['觀望']).push({
    value:[d.net_5d,d.net_1d,Math.abs(d.net_5d)], name:d.group_name, _:d }));

  const allX=data.map(d=>d.net_5d), allY=data.map(d=>d.net_1d);
  const xp=(Math.max(...allX.map(Math.abs))||1)*.12;
  const yp=(Math.max(...allY.map(Math.abs))||1)*.18;
  const axs={
    axisLabel:{color:'#4a6278',fontSize:16,fontFamily:'JetBrains Mono'},
    splitLine:{lineStyle:{color:'#1a2535',type:'dashed'}},
    axisLine:{lineStyle:{color:'#1a2535'}},
  };

  chart.setOption({
    backgroundColor:'transparent',
    animation:true,animationDuration:500,
    tooltip:{
      trigger:'item',
      backgroundColor:'#0d1118',borderColor:'#1a2535',borderWidth:1,
      padding:[14,18],
      textStyle:{color:'#8aa8bf',fontSize:17,fontFamily:'Noto Sans TC'},
      formatter:p=>{
        const d=p.data._;
        return `<b style="color:#cce0f0;font-size:20px">${d.group_name}</b>
<div style="display:grid;grid-template-columns:auto auto;gap:5px 20px;font-family:'JetBrains Mono',mono;font-size:16px;margin-top:8px">
<span style="color:#4a6278">五日淨買超</span><span style="color:${col(d.net_5d)};text-align:right">${fYi(d.net_5d)}</span>
<span style="color:#4a6278">今日淨買超</span><span style="color:${col(d.net_1d)};text-align:right">${fYi(d.net_1d)}</span>
<span style="color:#4a6278">近20日累計</span><span style="color:${col(d.net_20d)};text-align:right">${fYi(d.net_20d)}</span>
<span style="color:#4a6278">五日漲跌</span><span style="color:${col(d.change_5d_pct)};text-align:right">${fPct(d.change_5d_pct)}</span>
</div>
<div style="margin-top:8px;font-size:13px;color:#4a6278">點擊查看個股明細 →</div>`;
      }
    },
    legend:{data:Object.keys(BCOL),right:12,top:4,
      textStyle:{color:'#4a6278',fontSize:15,fontFamily:'JetBrains Mono'},
      itemWidth:14,itemHeight:14},
    grid:{left:84,right:26,top:50,bottom:70},
    // ── 滾輪縮放 ──
    dataZoom:[
      {type:'inside',xAxisIndex:0,filterMode:'none'},
      {type:'inside',yAxisIndex:0,filterMode:'none'},
    ],
    xAxis:{...axs,
      name:'資金出入量・五日淨買超（億）',
      nameLocation:'middle',nameGap:46,
      nameTextStyle:{color:'#4a6278',fontSize:16,fontFamily:'JetBrains Mono'},
      axisLabel:{...axs.axisLabel,formatter:v=>(v>=0?'+':'')+v.toFixed(0)},
      min:Math.min(...allX)-xp,max:Math.max(...allX)+xp},
    yAxis:{...axs,
      name:'資金加速度・今日淨買超（億）',
      nameTextStyle:{color:'#4a6278',fontSize:16,fontFamily:'JetBrains Mono'},
      axisLabel:{...axs.axisLabel,formatter:v=>(v>=0?'+':'')+v.toFixed(2)},
      min:Math.min(...allY)-yp,max:Math.max(...allY)+yp},
    series:Object.entries(grp).map(([nm,pts])=>({
      name:nm,type:'scatter',data:pts,
      symbolSize:d=>Math.max(14,Math.min(80,d[2]*2.8+14)),
      itemStyle:{color:BCOL[nm],opacity:.8,borderColor:BCOL[nm],borderWidth:1},
      emphasis:{itemStyle:{opacity:1,borderWidth:2,shadowBlur:16,shadowColor:BCOL[nm]}},
      label:{show:true,
        formatter:p=>p.data.name.length>6?p.data.name.slice(0,5)+'…':p.data.name,
        fontSize:14,color:'#8aa8bf',position:'top',distance:6},
    })),
  },true);
}

function filterBubble(mode,btn){
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const d=mode==='in'?ALL.filter(r=>r.net_5d>0)
        :mode==='out'?ALL.filter(r=>r.net_5d<0):ALL;
  renderBubble(d);
}

function resetZoom(btn){
  if(chart) chart.dispatchAction({type:'dataZoom',start:0,end:100});
}

// ── SIDE PANEL ──
function openPanel(d){
  document.getElementById('sp-title').textContent = d.group_name;

  const stats = [
    ['當日法人淨買超',    d.net_1d,        fYi],
    ['近 5 日法人淨買超', d.net_5d,        fYi],
    ['近 20 日累計淨買超', d.net_20d,       fYi],
    ['近 5 日漲跌',       d.change_5d_pct, fPct],
  ];
  document.getElementById('sp-stats').innerHTML = stats.map(([l,v,f])=>`
    <div class="sp-stat">
      <div class="sp-stat-label">${l}</div>
      <div class="sp-stat-val" style="color:${col(v)}">${f(v)}</div>
    </div>`).join('');

  const stocks = (d.stocks||[]).slice().sort((a,b)=>b.net_1d-a.net_1d);
  document.getElementById('sp-stocks').innerHTML = stocks.length
    ? stocks.map(s=>`
        <tr>
          <td class="sp-code">${s.code}</td>
          <td>${s.name||s.code}</td>
          <td class="sp-num ${cls(s.change_1d_pct)}">${fPct(s.change_1d_pct)}</td>
          <td class="sp-num ${cls(s.net_1d)}">${fYi(s.net_1d)}</td>
        </tr>`).join('')
    : '<tr><td colspan="4" style="color:var(--dim);padding:20px">此族群暫無個股資料</td></tr>';

  document.getElementById('spanel').classList.add('open');
  document.getElementById('overlay').classList.add('on');
}

function closePanel(){
  document.getElementById('spanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closePanel(); });

// ── FILTER TABLES ──
function stocksHTML(stocks){
  if(!stocks?.length)
    return `<div class="sinner" style="color:var(--dim)">此族群暫無個股資料</div>`;
  const rows=stocks.map(s=>`
    <div class="srow-item">
      <span class="s-code">${s.code}</span>
      <span class="s-name">${s.name||s.code}</span>
      <span class="s-num ${cls(s.change_1d_pct)}">${fPct(s.change_1d_pct)}</span>
      <span class="s-num ${cls(s.net_1d)}">${fYi(s.net_1d)}</span>
      <span class="s-num ${cls(s.change_5d_pct)}">${fPct(s.change_5d_pct)}</span>
      <span class="s-num ${cls(s.net_5d)}">${fYi(s.net_5d)}</span>
    </div>`).join('');
  return `<div class="sinner">
    <div class="shdr">
      <span>代號</span><span>名稱</span>
      <span style="text-align:right">今日漲跌</span>
      <span style="text-align:right">今日淨買超(億)</span>
      <span style="text-align:right">五日漲跌</span>
      <span style="text-align:right">五日淨買超(億)</span>
    </div>${rows}</div>`;
}

function renderTable(data,elId){
  const el=document.getElementById(elId);
  if(!data?.length){
    el.innerHTML='<div class="empty"><strong>目前無符合條件的族群</strong>等待資料更新後顯示</div>';
    return;
  }
  const maxN=Math.max(...data.map(r=>Math.abs(r.net_5d)));
  const thead=`<thead><tr>
    <th>#</th><th>族群名稱</th><th style="width:64px">個股數</th>
    <th style="text-align:right">五日淨買超(億)</th>
    <th style="text-align:right">今日淨買超(億)</th>
    <th style="text-align:right">五日漲跌(%)</th>
    <th style="text-align:right">今日漲跌(%)</th>
    <th>屬性</th></tr></thead>`;
  const tbody=data.map((r,i)=>{
    const pct=Math.abs(r.net_5d)/maxN*100;
    const bc=r.net_5d>=0?'rgba(240,64,48,.22)':'rgba(0,192,112,.18)';
    const rid=`${elId}-${i}`;
    const lc=(r.label||'觀')[0];
    return `
      <tr class="grow" onclick="toggle('${rid}',this)">
        <td class="td-rank"><span class="eico">▶</span>${i+1}</td>
        <td class="td-name">${r.group_name}</td>
        <td class="td-num n">${r.matched??r.stock_count}</td>
        <td class="td-num bcell">
          <div class="bbar" style="width:${pct}%;background:${bc}"></div>
          <span class="bval ${cls(r.net_5d)}">${fYi(r.net_5d)}</span></td>
        <td class="td-num ${cls(r.net_1d)}">${fYi(r.net_1d)}</td>
        <td class="td-num ${cls(r.change_5d_pct)}">${fPct(r.change_5d_pct)}</td>
        <td class="td-num ${cls(r.change_1d_pct)}">${fPct(r.change_1d_pct)}</td>
        <td><span class="badge b${lc}">${r.label}</span></td>
      </tr>
      <tr class="srow" id="${rid}"><td colspan="8">${stocksHTML(r.stocks)}</td></tr>`;
  }).join('');
  el.innerHTML=`<table class="ftable">${thead}<tbody>${tbody}</tbody></table>`;
}

function toggle(id,row){
  const tr=document.getElementById(id);
  if(!tr) return;
  const open=tr.classList.toggle('on');
  row.classList.toggle('exp',open);
}

// ── BOOT ──
async function boot(){
  await loadMeta();
  [ALL,INFLOW,STEALTH]=await Promise.all([
    load(BASE+'bubble_data.json'),
    load(BASE+'inflow_low_gain.json'),
    load(BASE+'stealth_accumulation.json'),
  ]);
  ALL=ALL||[];INFLOW=INFLOW||[];STEALTH=STEALTH||[];
  if(ALL.length){renderPills(ALL);renderBubble(ALL);}
  else document.getElementById('bubbleChart').innerHTML=
    '<div class="empty"><strong>等待資料更新</strong>請先執行 python pipeline.py</div>';
  renderTable(INFLOW,'inflowContent');
  renderTable(STEALTH,'stealthContent');
}
boot();
</script>
